name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GO_VERSION: "1.24"
  STATICCHECK_VERSION: "2025.1"
  GOVULNCHECK_VERSION: "v1.1.4"
  TOTAL_COVERAGE_MIN: "90"
  CRITICAL_COVERAGE_MIN: "80"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Enforce total coverage
        run: |
          COVER=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage: ${COVER}%"
          awk -v c="$COVER" -v min="${{ env.TOTAL_COVERAGE_MIN }}" 'BEGIN { if (c+0 < min+0) { exit 1 } }'

      - name: Enforce critical package coverage
        run: |
          go test ./internal/analysis ./internal/api ./internal/store ./internal/sync ./internal/tui/components -coverprofile=coverage-critical.out
          COVER=$(go tool cover -func=coverage-critical.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Critical package coverage: ${COVER}%"
          awk -v c="$COVER" -v min="${{ env.CRITICAL_COVERAGE_MIN }}" 'BEGIN { if (c+0 < min+0) { exit 1 } }'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          staticcheck ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -ldflags "-s -w -X main.version=${{ github.sha }}" -o whooper .

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: go build -ldflags "-s -w -X main.version=${{ github.sha }}" -o whooper .

      - name: Run smoke checks
        run: |
          export HOME=$(mktemp -d)
          ./whooper doctor --skip-api
          ./whooper config set client-id smoke-client-id
          ./whooper config set client-secret smoke-client-secret
          ./whooper config
          ./whooper export -e recoveries -f json > /dev/null
          ./whooper doctor --skip-api

  release:
    name: Release
    needs: [test, lint, build, smoke]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release Smoke Check
        run: make release-smoke VERSION=${{ env.VERSION }}

      - name: Run GoReleaser (Publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
