name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build the container image via a remote BuildKit endpoint so the apps-runner
# does not need a local Docker socket. Images are never pushed from PRs.
#
# BUILDKIT_ENDPOINT is injected on apps-runner (no repo secret required).

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build
    runs-on: apps-runner
    # Avoid running untrusted fork PR code on self-hosted infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${image}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve remote BuildKit endpoint
        id: buildkit
        run: |
          set -euo pipefail
          # Endpoint is injected on the runner (not a repo secret).
          if [ -z "${BUILDKIT_ENDPOINT:-}" ]; then
            echo "BUILDKIT_ENDPOINT is not set in the runner environment"
            exit 1
          fi
          echo "endpoint=${BUILDKIT_ENDPOINT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (remote driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ steps.buildkit.outputs.endpoint }}

      - name: Log in to GHCR
        # Login only when we will push (never on pull_request).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs: build only (no registry push). main: push sha + latest tags.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
