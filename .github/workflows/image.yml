name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build the container image via a remote BuildKit endpoint so the apps-runner
# does not need a local Docker socket. Images are never pushed from PRs.
#
# Required repository secret:
#   BUILDKIT_ENDPOINT  e.g. tcp://buildkit.example:1234  or  ssh://user@host
#
# Optional (TLS auth for remote BuildKit — set if your builder requires them):
#   BUILDKIT_CA / BUILDKIT_CERT / BUILDKIT_KEY  (PEM contents)

env:
  REGISTRY: ghcr.io
  # Lowercase image name required by GHCR.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/whooper

jobs:
  build:
    name: build
    runs-on: apps-runner
    # Avoid running untrusted fork PR code on self-hosted infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${image}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Require remote BuildKit endpoint
        env:
          BUILDKIT_ENDPOINT: ${{ secrets.BUILDKIT_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${BUILDKIT_ENDPOINT:-}" ]; then
            echo "BUILDKIT_ENDPOINT secret is not set."
            echo "Add a repository secret pointing at a remote BuildKit instance"
            echo "(e.g. tcp://buildkit-host:1234) so image builds do not need a local docker.sock."
            exit 1
          fi

      - name: Set up Docker Buildx (remote driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ secrets.BUILDKIT_ENDPOINT }}
        env:
          # Optional TLS material for the remote builder node (node index 0).
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDKIT_CA }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDKIT_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDKIT_KEY }}

      - name: Log in to GHCR
        # Login only when we will push (never on pull_request).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs: build only (no registry push). main: push sha + latest tags.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
