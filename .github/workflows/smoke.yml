name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  # Host binary only — apps-runner has no Docker socket, so we do not use
  # GHA service containers or docker build for smoke.
  smoke-test:
    name: smoke-test
    runs-on: apps-runner
    # Avoid running untrusted fork PR code on self-hosted infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run CLI smoke tests
        run: |
          set -euo pipefail
          export WHOOPER_HOME=$(mktemp -d)
          echo "WHOOPER_HOME=$WHOOPER_HOME" >> "$GITHUB_ENV"

          echo "Checking version..."
          ./whooper version

          echo "Checking initial config (should be empty/defaults)..."
          ./whooper config

          echo "Setting config values..."
          ./whooper config set client-id test-client-id
          ./whooper config set client-secret test-client-secret
          ./whooper config set redirect-url http://localhost:8484/callback

          echo "Verifying config values were set..."
          ./whooper config | grep "test-client-id"
          ./whooper status --json | grep '"client_secret_configured": true'
          ./whooper config | grep "http://localhost:8484/callback"

          echo "Checking status (JSON)..."
          ./whooper status --json

          echo "Running doctor (skip-api)..."
          ./whooper doctor --skip-api

          echo "Running doctor (JSON, skip-api)..."
          ./whooper doctor --json --skip-api

          echo "Running export (empty DB)..."
          ./whooper export --entity recoveries --format json
          ./whooper export --entity cycles --format json
          ./whooper export --entity sleeps --format json
          ./whooper export --entity workouts --format json

      - name: Smoke test API server (host process)
        run: |
          set -euo pipefail
          # apps-runner has no Docker socket; run serve as a normal process.
          PORT=$(( 10000 + RANDOM % 10000 ))
          echo "Using port $PORT"

          ./whooper serve --addr "127.0.0.1:${PORT}" > serve.log 2>&1 &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true' EXIT

          MAX_RETRIES=15
          COUNT=0
          until curl -sf "http://127.0.0.1:${PORT}/healthz" >/dev/null || [ "$COUNT" -eq "$MAX_RETRIES" ]; do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "Server process died early!"
              cat serve.log
              exit 1
            fi
            echo "Waiting for server to be ready..."
            sleep 1
            COUNT=$((COUNT + 1))
          done

          if [ "$COUNT" -eq "$MAX_RETRIES" ]; then
            echo "Server failed to start (timeout)"
            cat serve.log
            exit 1
          fi

          echo "Testing endpoints..."
          curl -sf "http://127.0.0.1:${PORT}/healthz"
          curl -sf "http://127.0.0.1:${PORT}/status"
          curl -sf "http://127.0.0.1:${PORT}/api/summary"
          curl -sf "http://127.0.0.1:${PORT}/metrics" | head -n 20

          echo "Stopping server..."
          kill "$SERVE_PID"
          wait "$SERVE_PID" || true
