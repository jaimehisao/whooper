name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24.2"

jobs:
  # CLI smoke against a host-built binary (no API server process).
  smoke-cli:
    name: smoke-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run CLI smoke tests
        run: |
          set -euo pipefail
          export WHOOPER_HOME=$(mktemp -d)
          echo "WHOOPER_HOME=$WHOOPER_HOME" >> "$GITHUB_ENV"

          echo "Checking version..."
          ./whooper version

          echo "Checking initial config (should be empty/defaults)..."
          ./whooper config

          echo "Setting config values..."
          ./whooper config set client-id test-client-id
          ./whooper config set client-secret test-client-secret
          ./whooper config set redirect-url http://localhost:8484/callback

          echo "Verifying config values were set..."
          ./whooper config | grep "test-client-id"
          ./whooper status --json | grep '"client_secret_configured": true'
          ./whooper config | grep "http://localhost:8484/callback"

          echo "Checking status (JSON)..."
          ./whooper status --json

          echo "Running doctor (skip-api)..."
          ./whooper doctor --skip-api

          echo "Running doctor (JSON, skip-api)..."
          ./whooper doctor --json --skip-api

          echo "Running export (empty DB)..."
          ./whooper export --entity recoveries --format json
          ./whooper export --entity cycles --format json
          ./whooper export --entity sleeps --format json
          ./whooper export --entity workouts --format json

  # Build and publish an image for the API service job.
  # GHA service containers must pull an image at job start, so we push to GHCR first.
  smoke-image:
    name: smoke-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          set -euo pipefail
          # GHCR requires lowercase repository names.
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/whooper:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push smoke image
        run: |
          set -euo pipefail
          docker build -t "${{ steps.image.outputs.image }}" .
          docker push "${{ steps.image.outputs.image }}"

  # Probe HTTP API against a whooper service container (not a background process).
  smoke-api:
    name: smoke-api
    needs: [smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      whooper:
        image: ${{ needs.smoke-image.outputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 9464:9464
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:9464/healthz || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 15s
    steps:
      - name: Wait for service health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9464/healthz >/dev/null; then
              echo "whooper service is healthy"
              exit 0
            fi
            echo "waiting for whooper service ($i)..."
            sleep 1
          done
          echo "whooper service failed to become healthy"
          exit 1

      - name: Probe API endpoints
        run: |
          set -euo pipefail

          echo "GET /healthz"
          curl -sf http://127.0.0.1:9464/healthz
          echo

          echo "GET /status"
          curl -sf http://127.0.0.1:9464/status
          echo

          echo "GET /api/summary"
          curl -sf http://127.0.0.1:9464/api/summary
          echo

          echo "GET /metrics"
          curl -sf http://127.0.0.1:9464/metrics | head -n 20
          echo
