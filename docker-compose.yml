services:
  whooper:
    build: .
    environment:
      - WHOOPER_HOME=/data
      - WHOOPER_SYNC_INTERVAL=${WHOOPER_SYNC_INTERVAL:-30m}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - exec whooper service --addr 0.0.0.0:9464 --interval "$${WHOOPER_SYNC_INTERVAL}"
    ports:
      - "9464:9464"
    volumes:
      - ${WHOOPER_HOME:-${HOME}/.whooper}:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=whooper
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
      # Mount the whole data dir so Grafana can see WAL/SHM siblings of whooper.db.
      - ${WHOOPER_HOME:-${HOME}/.whooper}:/data:ro
    restart: unless-stopped

volumes:
  grafana-data:
